# Production stack. Works with Docker Compose v2 and `podman compose` /
# podman-compose on RHEL. Only nginx publishes ports; Postgres, Redis, the
# API and the UI stay on the internal network. All config comes from
# deploy/.env.prod (generated by deploy/install-rhel.sh).
name: netsphere

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  DATABASE_URL: postgresql+psycopg://netsphere:${POSTGRES_PASSWORD}@postgres:5432/netsphere
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  CORS_ORIGINS: ${CORS_ORIGINS}

services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: netsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: netsphere
    volumes:
      - netsphere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsphere"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netsphere_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: localhost/netsphere-backend:${NETSPHERE_VERSION:-latest}
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    image: localhost/netsphere-backend:${NETSPHERE_VERSION:-latest}
    restart: unless-stopped
    environment: *backend-env
    healthcheck:
      disable: true   # image HEALTHCHECK probes the API port, which the worker doesn't serve
    depends_on:
      backend: {condition: service_healthy}
    command: celery -A app.worker worker --loglevel=info

  frontend:
    image: localhost/netsphere-frontend:${NETSPHERE_VERSION:-latest}
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend: {condition: service_healthy}

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/${NGINX_CONF:-http.conf}:/etc/nginx/conf.d/default.conf:ro,Z
      - ./deploy/certs:/etc/nginx/certs:ro,Z

volumes:
  netsphere_pgdata:
  netsphere_redis:
